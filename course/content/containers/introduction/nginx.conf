# -----------------------------------------------------------------
# Identical to Chapter 4 with two small container adaptations:
#
#   1. 'user' directive removed   — the process already runs as the
#      nginx user via the Dockerfile USER instruction. Specifying
#      'user' here would require root to setuid and cause an error.
#
#   2. 'pid' path changed to /tmp — /run is not writable by the
#      unprivileged nginx user inside a container.
#
# Everything else is the same configuration from Chapter 4.
# -----------------------------------------------------------------

pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

error_log /dev/stderr;

http {
  access_log /dev/stdout;

  # nginx temporary files — must be writable by the nginx user
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp_path;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server {
    listen 80;
    server_name my-website.com localhost;

    location / {
      root  /websites/my-website;
      index home.html;
    }
  }
}
